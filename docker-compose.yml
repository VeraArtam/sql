services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deadline
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      # Если требуется очистка данных, можно добавить скрипт очистки
      # - ./cleanup.sql:/docker-entrypoint-initdb.d/cleanup.sql